name: CI - Pruebas E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    name: Pruebas E2E con Playwright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Crear archivo .env para tests
        run: |
          echo "DB_HOST=aws-1-us-east-1.pooler.supabase.com" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_USER=postgres.nwvtcjiiouwftuzsgzih" >> .env
          echo "DB_PASSWORD=so4PBKDk0vfbceLz" >> .env
          echo "DB_NAME=postgres" >> .env
          echo "JWT_SECRET=Zomboid" >> .env
          echo "JWT_EXPIRES=20m" >> .env
          echo "VITE_API_URL=http://localhost:3000" >> .env
          echo "NODE_ENV=development" >> .env

      - name: Iniciar servidor backend
        run: npm run start &
        env:
          NODE_ENV: development

      - name: Esperar a que el backend esté listo
        run: |
          echo "Esperando backend en puerto 3000..."
          for i in $(seq 1 15); do
            curl -s http://localhost:3000/health && echo "Backend listo" && exit 0
            echo "Intento $i/15 - esperando..."
            sleep 3
          done
          echo "❌ Backend no respondió a tiempo"
          exit 1

      - name: Correr pruebas E2E
        run: npm run test:e2e
        env:
          CI: true

      - name: Subir reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7