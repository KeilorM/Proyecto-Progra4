name: CI - Pruebas E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    name: Pruebas E2E con Playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campamento_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Crear base de datos y ejecutar seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d campamento_db -f database/ddl.sql
          psql -h localhost -U postgres -d campamento_db -f database/seed.sql

      - name: Crear archivo .env para tests
        run: |
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "DB_NAME=campamento_db" >> .env
          echo "JWT_SECRET=secret_para_tests" >> .env
          echo "JWT_EXPIRES=1h" >> .env

      - name: Correr pruebas E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
